name: Aktualizacja FreeTube

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sprawdź nowe wydanie (starsze niż 7 dni)
        id: update
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MIN_AGE_DAYS: "7"
        run: python3 scripts/update_freetube.py

      - name: Zapisz zmianę
        if: steps.update.outputs.version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/freetube.rb
          git commit -m "freetube ${{ steps.update.outputs.version }}"
          git push
